<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>タグ帳 試作</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap"><style>
/* 色・フォントはここに集約（モック repos/mock/mock_new/index.html の stage の中身から写した） */
:root{
  /* 9/21 夕方 小室さんの更新（和風の配色）に合わせた */
  --ai:#1C2B3D;        /* 紺：左メニュー */
  --ai-hover:#24374F; --ai-on:#8B6914; --ai-text:#C7BFA0; --ai-label:#A88F55; --ai-sub:#A79877;
  --bg:#F7F3E8; --card:#FFFFFF; --line:#D8BE7C; --line-soft:#F3E3B0;
  --ink:#1C2B3D; --sub:#6B6459; --ink2:#4A4438;
  --shu:#A83B2E; --shu-hover:#8B2F22; --shu-bg:#F5E4E1;   /* 朱：主ボタン */
  --live:#B85C82;
  --teal-bg:#E6EDDC; --teal:#3C5C34;    /* 若草（旧・青緑の置き換え） */
  --blue-bg:#E2E9F0; --blue:#1B3A5C;
  --amber-bg:#F3E8CE; --amber:#8C6A0C;
  --purple-bg:#EDE6F2; --purple:#55407A;
  --sand:#F3E3B0; --bar:#EAE2CC; --off:#CFC3A6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul{padding:0;list-style:none}
a{color:#A83B2E;text-decoration:none}
a:hover{color:#6B241C}
.wa{font-family:"Zen Maru Gothic",sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.sh{box-shadow:0 1px 2px rgba(30,38,52,.05)}
.ttl{font-size:19px;font-weight:700;letter-spacing:.01em}
.sub{font-size:12px;color:var(--sub);line-height:1.5}
.mut{color:var(--sub)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;line-height:1.2;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px "Noto Sans JP",sans-serif;padding:11px 14px;min-height:44px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F8F3E8;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--shu);border-color:var(--shu);color:#FFFFFF}
.btn-p:hover{background:var(--shu-hover);color:#FFFFFF}
.btn-s{padding:7px 11px;min-height:34px;font-size:12px;border-radius:8px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--ai-text);font-size:13px;font-weight:500;min-height:42px}
.nav:hover{background:var(--ai-hover);color:#FFFFFF}
.navon{background:var(--ai-on);color:#FFFFFF}
.navlbl{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--ai-label);padding:14px 12px 5px}
.badge{margin-left:auto;background:var(--shu);color:#FFFFFF;border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0 6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums;font-size:12px}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:11px;font-weight:700;color:var(--sub);padding:0 10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
input,select,textarea{font-family:"Noto Sans JP",sans-serif}
.inp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;background:var(--card);color:var(--ink);min-height:42px;width:100%}
.avt{border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;background:var(--teal-bg);color:var(--teal)}
.tab{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);min-height:40px;white-space:nowrap}
.tabon{background:var(--ai);color:#FFFFFF}
.kpi{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dot{width:8px;height:8px;border-radius:999px;flex-shrink:0}

/* アプリの骨組み：左の藍メニュー＋右の本文 */
.shell{display:flex;height:100vh;overflow:hidden}
.side{width:238px;flex-shrink:0;background:var(--ai);display:flex;flex-direction:column;padding:18px 12px 14px;overflow:auto}
.main{flex-grow:1;display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh}
.topbar{height:64px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px}
.topbar h1{font-size:22px;font-weight:700}
.body{flex-grow:1;min-height:0;padding:20px 24px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.sec{font-size:22px;font-weight:700;color:var(--ink);padding-top:6px}
.empty{padding:22px;text-align:center;color:var(--sub);font-size:13px}
.note{font-size:12px;color:var(--sub);background:var(--sand);border-radius:10px;padding:10px 12px}
.err{font-size:13px;color:var(--shu);background:var(--shu-bg);border-radius:10px;padding:10px 12px}
.shu-tabs .tabon{background:var(--shu)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;align-items:start}
.topic{padding:8px 10px;background:var(--bg);border-radius:9px;display:flex;flex-direction:column;gap:3px}
button.tab{border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:inherit}
button.tab.tabon{border-color:transparent;background:var(--ai);color:#FFFFFF}
.shu-tabs button.tab.tabon{background:var(--shu)}
button.tab:disabled{opacity:.5;cursor:not-allowed}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite}
.overlay{position:fixed;inset:0;background:rgba(28,43,61,.18);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadein .15s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* 読み込み中の表示は 0.35秒たってから出す（すぐ終わる切り替えでチラつかせない） */
.loader-delay{opacity:0;animation:fadein .2s ease-out .35s forwards}
@keyframes bob{0%,100%{transform:rotate(-40deg) translateY(0)}50%{transform:rotate(-40deg) translateY(-3px)}}
.card-bob{transform-box:fill-box;transform-origin:center;animation:bob 1.1s ease-in-out infinite}
@keyframes talk{0%,100%{box-shadow:0 0 0 3px var(--live)}50%{box-shadow:0 0 0 7px rgba(184,92,130,.35)}}
.talking{animation:talk 1.4s ease-in-out infinite}

/* ===== スマホ・タブレット（幅820px以下） =====
   左の藍メニューを上の横並びに、横に並んでいる列を縦に積む。
   画面ごとの固定幅（style 属性）は、ここでまとめて 100% に上書きする */
@media (max-width: 820px){
  .shell{flex-direction:column;height:auto;min-height:100vh;overflow:visible}
  .side{width:100%;flex-direction:row;align-items:center;gap:4px;padding:8px 10px;overflow-x:auto;position:sticky;top:0;z-index:40}
  .side .navlbl,.side > div:nth-of-type(1),.side > span{display:none}
  .side .nav{min-height:36px;padding:6px 10px;white-space:nowrap;flex-shrink:0}
  .side .nav span:not(.badge){display:inline}
  .main{height:auto;min-height:0}
  .topbar{height:auto;min-height:56px;flex-wrap:wrap;padding:10px 14px;gap:8px}
  .topbar form{display:none !important}
  .body{padding:14px;overflow:visible !important}
  .body[style*="flex-direction: row"]{flex-direction:column !important}
  [style*="width: 300px"],[style*="width: 340px"],[style*="width: 360px"],[style*="width: 400px"],[style*="width: 440px"],[style*="width: 260px"]{width:100% !important}
  [style*="grid-template-columns: 1fr 1fr"],[style*="grid-template-columns: repeat(3, 1fr)"],[style*="grid-template-columns: 1.4fr 1fr 1fr"]{grid-template-columns:1fr !important}
  [style*="position: sticky"]{position:static !important}
  .card[style*="flex-grow: 1"][style*="min-height: 0"]{min-height:60vh}
}
/* スクロールはできるがバーは見せない（はみ出しで「続きがある」と分かるため） */
.noscrollbar{scrollbar-width:none}
.noscrollbar::-webkit-scrollbar{display:none}
/* 押せる行・カード: ホバーで色が変わって「押せそう」に見せる */
.hoverable{transition:background .15s,border-color .15s,transform .15s}
.hoverable:hover{background:var(--sand);border-color:var(--line)}
/* 知識地図: 検索で当たった丸を光らせる */
.map-pulse{animation:mapPulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes mapPulse{0%{opacity:1;transform:scale(.85)}100%{opacity:0;transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.map-pulse{animation:none}}
/* タグ帳の単語帳（admin/tags/TagDeck.js）
   札は横長。穴は短い辺（左）の真ん中（中心 x=36px, y=50%）。リングはその穴を通す。
   めくる＝穴を軸に左へ／破る＝穴の左側だけが裂けてリングから抜ける */
.deck-back{position:fixed;inset:0;z-index:300;background:rgba(14,20,27,.74);display:flex;align-items:center;justify-content:center;padding:16px;animation:deckIn .35s ease-out}
.deck-out{animation:deckOut .35s ease-in forwards}
@keyframes deckIn{from{opacity:0}to{opacity:1}}
@keyframes deckOut{to{opacity:0}}
.deck-card{position:absolute;inset:0;background:#FFFDF6;border-radius:14px;border:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.3);transform-origin:36px 50%;
  background-image:linear-gradient(transparent 0 58px,var(--line-soft) 58px 59px,transparent 59px)}
.deck-card::before{content:"";position:absolute;left:25px;top:calc(50% - 11px);width:22px;height:22px;border-radius:999px;background:#2A323D;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.deck-top{backface-visibility:visible;cursor:grab;touch-action:none;user-select:none;transition:transform .25s,box-shadow .25s;animation:deckRise .45s ease-out}
.deck-top:focus-visible{outline:3px solid #E0B84A;outline-offset:3px}
@keyframes deckRise{from{transform:rotate(3deg);opacity:.5}to{transform:none;opacity:1}}
.deck-ring{position:absolute;left:-94px;top:calc(50% - 70px);pointer-events:none}
/* 採用: 穴を支点に 左斜め上へ ひねりながら持ち上がり、リングを越えて裏へ回る。
   ★ カクつき対策: キーフレームを「始め→終わり」の2点だけにして、途中で速度が切り替わらないようにする
     （中間点を置くと区間ごとにイージングがかかり、止まっては動くように見える）。
     回転は同じ並び（rotateZ→rotateX）なので、ブラウザは角度をそのまま滑らかに補間する。
     影は毎フレーム描き直すと重いので、めくる間は消す。GPUに載せるため will-change を付ける */
.deck-flip{animation:deckFlip .7s cubic-bezier(.35,.05,.35,1) forwards;box-shadow:none;will-change:transform,opacity}
.deck-flip::after{content:"";position:absolute;inset:0;border-radius:14px;background:#EFE8D4;opacity:0;animation:deckBackside .7s linear forwards}
@keyframes deckFlip{
  from{transform:perspective(1100px) rotateZ(0deg) rotateX(0deg);opacity:1}
  to{transform:perspective(1100px) rotateZ(-160deg) rotateX(180deg);opacity:.15}}
/* 紙の裏面: 札が真横を向く（半分を過ぎた）あたりで、ふっと切り替える */
@keyframes deckBackside{0%,42%{opacity:0}52%,100%{opacity:1}}
/* 却下: 穴から左の辺までの細い部分にギザギザの裂け目が入り、札が右下へ抜けて落ちる */
.deck-tear{pointer-events:none;animation:deckTear .7s ease-in forwards;
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 51%,9px 52.5%,5px 50.5%,14px 51.5%,11px 49.5%,20px 50.5%,26px 50%,20px 49.5%,11px 48.5%,14px 47%,5px 48%,9px 46%,0 49%)}
@keyframes deckTear{0%{transform:none}15%{transform:translateX(10px) rotate(-1deg)}25%{transform:translateX(4px)}100%{transform:translate(170px,300px) rotate(16deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.deck-flip,.deck-flip::after,.deck-tear,.deck-top,.deck-back{animation-duration:.01s}}
