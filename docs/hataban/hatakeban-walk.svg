<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" role="img" aria-label="畝の上を歩いて見回る畑番">
<style>
.hb-walk{transform-box:fill-box;transform-origin:center bottom;animation:hb-move 11s linear infinite}
.hb-turn{transform-box:fill-box;transform-origin:center bottom;animation:hb-turn 11s steps(1,end) infinite}
.hb-bob{transform-box:fill-box;transform-origin:center bottom;animation:hb-bob .86s ease-in-out infinite}
.hb-la,.hb-lb,.hb-arm{transform-box:fill-box;transform-origin:50% 8%}
.hb-la{animation:hb-la .86s ease-in-out infinite}.hb-lb{animation:hb-lb .86s ease-in-out infinite}
.hb-arm{transform-origin:20% 10%;animation:hb-arm .86s ease-in-out infinite}
.hb-sprout{transform-box:fill-box;transform-origin:center bottom;animation:hb-leaf 2.7s ease-in-out infinite}
.hb-s2{animation-delay:.4s}.hb-s3{animation-delay:.8s}.hb-s4{animation-delay:1.2s}.hb-s5{animation-delay:1.6s}.hb-s6{animation-delay:2s}
@keyframes hb-move{0%{transform:translateX(5px)}50%{transform:translateX(165px)}100%{transform:translateX(5px)}}
@keyframes hb-turn{0%,49.99%{transform:scaleX(1)}50%,99.99%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
@keyframes hb-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.55px)}}
@keyframes hb-la{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-14deg)}}
@keyframes hb-lb{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}}
@keyframes hb-arm{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes hb-leaf{0%,84%,100%{transform:rotate(0)}90%{transform:rotate(3deg)}96%{transform:rotate(-2deg)}}
@media(prefers-reduced-motion:reduce){.hb-walk{animation:none;transform:translateX(85px)}.hb-turn,.hb-bob,.hb-la,.hb-lb,.hb-arm,.hb-sprout{animation:none}}
</style>

<!-- 畝 -->
<path fill="#5E4330" d="M0 44C18 38 32 39 48 42C65 37.5 80 38 97 42C114 37.5 130 38.5 146 42C164 37.5 183 39 200 44V50H0Z"/>
<path fill="#8A5A2B" d="M0 42.5C18 36.8 33 37.8 48 40.5C65 36 81 36.8 97 40.5C114 36 130 37 146 40.5C164 36 183 37.5 200 42.5V45C182 41 164 40.5 146 43C130 40 114 40 97 43C80 40 65 40 48 43C32 40 17 40 0 45Z"/>

<!-- 芽 -->
<g fill="#4E7A3F">
 <g class="hb-sprout"><path d="M20 39v-4h1v4zM20.4 36.5c-3.3-.1-4.2-2.4-4.1-3.4 2.8 0 4.1 1.2 4.1 3.4zM20.7 36.4c3.2-.1 4-2.4 3.9-3.4-2.7 0-3.9 1.2-3.9 3.4z"/></g>
 <g class="hb-sprout hb-s2"><path d="M52 38.5v-4h1v4zM52.4 36c-3.2-.1-4-2.3-3.9-3.3 2.7 0 3.9 1.2 3.9 3.3zM52.7 35.9c3.1-.1 3.9-2.3 3.8-3.3-2.6 0-3.8 1.2-3.8 3.3z"/></g>
 <g class="hb-sprout hb-s3"><path d="M84 39v-4h1v4zM84.4 36.5c-3.1-.1-3.9-2.3-3.8-3.2 2.6 0 3.8 1.1 3.8 3.2zM84.7 36.4c3.1-.1 3.9-2.3 3.8-3.2-2.6 0-3.8 1.1-3.8 3.2z"/></g>
 <g class="hb-sprout hb-s4"><path d="M116 38.6v-4h1v4zM116.4 36.1c-3.2-.1-4-2.3-3.9-3.3 2.7 0 3.9 1.2 3.9 3.3zM116.7 36c3.1-.1 3.9-2.3 3.8-3.3-2.6 0-3.8 1.2-3.8 3.3z"/></g>
 <g class="hb-sprout hb-s5"><path d="M148 39v-4h1v4zM148.4 36.5c-3.1-.1-3.9-2.3-3.8-3.2 2.6 0 3.8 1.1 3.8 3.2zM148.7 36.4c3.1-.1 3.9-2.3 3.8-3.2-2.6 0-3.8 1.1-3.8 3.2z"/></g>
 <g class="hb-sprout hb-s6"><path d="M180 38.5v-4h1v4zM180.4 36c-3.2-.1-4-2.3-3.9-3.3 2.7 0 3.9 1.2 3.9 3.3zM180.7 35.9c3.1-.1 3.9-2.3 3.8-3.3-2.6 0-3.8 1.2-3.8 3.3z"/></g>
</g>

<!-- 畑番 -->
<g class="hb-walk"><g class="hb-turn"><g class="hb-bob">
 <!-- 後脚 -->
 <g class="hb-lb"><path fill="#1C2B3D" d="M12.7 27h3l-.7 9.2-2.2.1z"/><path fill="#5E4330" d="M12.7 35.6h2.4l.5 3.1h-3.7z"/></g>
 <!-- 前脚 -->
 <g class="hb-la"><path fill="#1C2B3D" d="M16 27h3l1 9.1-2.2.2z"/><path fill="#5E4330" d="M17.8 35.6h2.4l1.2 3.1h-3.8z"/></g>

 <!-- 細身の作務衣 -->
 <path fill="#1C2B3D" d="M12 15.1c1.4-1 5.4-1.1 6.9-.1l1.2 12.6c-2.2 1.1-6.3 1.1-8.6.1z"/>
 <!-- 後ろ腕 -->
 <path fill="#1C2B3D" d="M12.5 15.8l-1.8 1.3-1.4 7.3 1.6.4 3-6.8z"/><path fill="#E8BE98" d="M9.2 24.1c-.4 1 .1 2 .8 2 .7-.1 1-.8.9-1.5z"/>

 <!-- じょうろ側 -->
 <g class="hb-arm">
  <path fill="#1C2B3D" d="M18.3 15.7l1.7.9 2.2 5.8-1.5.6-3.8-5z"/><path fill="#E8BE98" d="M20.7 22.3c-.1.9.5 1.6 1.2 1.4.8-.2.9-1 .4-1.7z"/>
  <path fill="#6E8B9E" d="M21.3 23c1.3-1.3 5.2-1.4 6.5-.2l-.3 4c-1.7.7-4.3.7-6 .1zM27.1 23.1l5.1-1.7.5 1.1-5.2 2.5zM22 22.5c-.1-2.7 4.5-3.2 5.2-.3l-1.2.2c-.5-1.6-2.7-1.5-2.8.1z"/>
 </g>

 <!-- 首・顔・髭 -->
 <path fill="#E8BE98" d="M14.8 13h2.7v3h-2.7z"/>
 <path fill="#E8BE98" d="M13.8 8.1c.3-2.4 4.8-2.5 5.2-.1l-.4 4.3c-1 1.8-3.2 1.9-4.3.2z"/>
 <path fill="#5E4330" d="M15.2 11.6c1.1.6 2.3.4 3.4-.4l-.3 2c-1 1.1-2.4 1-3.1-.1z"/>

 <!-- 浅い麦わら帽子 -->
 <path fill="#D8B45A" d="M11.2 7.4c3.4-1.3 8.3-1.3 11-.4-2.2 1.1-8.2 1.6-11.6 1zM13.6 6.9c.3-3 5.5-3.5 6.7-.2-2.1.5-4.8.6-6.7.2z"/>
 <path fill="#A83B2E" d="M13.9 5.9c2 .4 4.4.3 6.1-.2l.3 1c-2.1.5-4.8.6-6.7.2z"/>
</g></g></g>
</svg>