    <g class="hb-walkcycle">

      <g class="hb-leg hb-leg-back">
        <path d="M-1.7,-13.5 L-0.5,-13.5 L-0.9,-3.2 L-2.0,-3.2 Z" fill="#1C2B3D"/>
