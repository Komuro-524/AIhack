<svg viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.hb-mover,.hb-walkcycle,.hb-leg,.hb-arm,.hb-sprout{transform-box:fill-box;}
.hb-mover{transform-origin:50% 50%;animation:hb-move 11s linear infinite,hb-flip 11s linear infinite;}
.hb-walkcycle{transform-origin:50% 100%;animation:hb-bob 1.3s ease-in-out infinite;}
.hb-leg{transform-origin:50% 0%;animation:hb-leg-swing 1.3s ease-in-out infinite;}
.hb-leg-back{animation-delay:0s;}
.hb-leg-front{animation-delay:-0.65s;}
.hb-arm{transform-origin:50% 0%;animation:hb-arm-swing 1.3s ease-in-out infinite;animation-delay:-0.3s;}
.hb-sprout{transform-origin:50% 100%;animation:hb-sprout-wiggle 11s linear infinite;}

@keyframes hb-move{0%{translate:0 0;}50%{translate:142px 0;}100%{translate:0 0;}}
@keyframes hb-flip{0%,49.9%{scale:1 1;}50%,99.9%{scale:-1 1;}100%{scale:1 1;}}
@keyframes hb-bob{0%,100%{translate:0 0;}50%{translate:0 -0.6px;}}
@keyframes hb-leg-swing{0%,100%{rotate:11deg;}50%{rotate:-11deg;}}
@keyframes hb-arm-swing{0%,100%{rotate:-5deg;}50%{rotate:5deg;}}
@keyframes hb-sprout-wiggle{0%{rotate:0deg;}3%{rotate:12deg;}6%{rotate:-7deg;}9%,100%{rotate:0deg;}}

@media (prefers-reduced-motion: reduce){
  .hb-mover{animation:none;translate:71px 0;scale:1 1;}
  .hb-walkcycle{animation:none;translate:0 0;}
  .hb-leg,.hb-arm{animation:none;rotate:0deg;}
  .hb-sprout{animation:none;rotate:0deg;}
}
</style>

<!-- 畝：影 -->
<path d="M0,50 L0,40 C20,37 35,39 55,36 C75,34 95,38 115,35 C135,33 155,37 175,35 C185,34 200,36 200,37 L200,50 Z" fill="#5E4330"/>
<!-- 畝：土 -->
<path d="M0,47 L0,40 C20,37 35,39 55,36 C75,34 95,38 115,35 C135,33 155,37 175,35 C185,34 200,36 200,37 L200,47 Z" fill="#8A5A2B"/>

<!-- 双葉（芽） -->
