  <path d="M0,0 C1,-1.6 1.3,-2.8 0.2,-3.4 C-0.2,-2.4 -0.3,-1.2 0,0 Z" fill="#4E7A3F"/>
</g>
<g class="hb-sprout" transform="translate(100,36.5)" style="animation-delay:-3.18s">
  <path d="M0,0 C-1,-1.6 -1.3,-2.8 -0.2,-3.4 C0.2,-2.4 0.3,-1.2 0,0 Z" fill="#4E7A3F"/>
  <path d="M0,0 C1,-1.6 1.3,-2.8 0.2,-3.4 C-0.2,-2.4 -0.3,-1.2 0,0 Z" fill="#4E7A3F"/>
</g>
<g class="hb-sprout" transform="translate(125,35.5)" style="animation-delay:-4.14s">
  <path d="M0,0 C-1,-1.6 -1.3,-2.8 -0.2,-3.4 C0.2,-2.4 0.3,-1.2 0,0 Z" fill="#4E7A3F"/>
  <path d="M0,0 C1,-1.6 1.3,-2.8 0.2,-3.4 C-0.2,-2.4 -0.3,-1.2 0,0 Z" fill="#4E7A3F"/>
</g>
<g class="hb-sprout" transform="translate(150,36)" style="animation-delay:-5.11s">
  <path d="M0,0 C-1,-1.6 -1.3,-2.8 -0.2,-3.4 C0.2,-2.4 0.3,-1.2 0,0 Z" fill="#4E7A3F"/>
  <path d="M0,0 C1,-1.6 1.3,-2.8 0.2,-3.4 C-0.2,-2.4 -0.3,-1.2 0,0 Z" fill="#4E7A3F"/>
</g>

