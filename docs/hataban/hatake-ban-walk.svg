<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .fw-character, .fw-leg, .fw-arm, .fw-hat { transform-box: fill-box; }

  .fw-character {
    animation: fw-bounce 0.7s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  .fw-leg {
    animation: fw-leg-swing 0.7s ease-in-out infinite;
    transform-origin: 50% 0%;
  }
  .fw-leg-back  { animation-delay: 0s; }
  .fw-leg-front { animation-delay: -0.35s; }

  .fw-arm {
    animation: fw-arm-swing 0.7s ease-in-out infinite;
    animation-delay: -0.15s;
    transform-origin: 0% 0%;
  }
  .fw-hat {
    animation: fw-hat-sway 0.7s ease-in-out infinite;
    animation-delay: 0.08s;
    transform-origin: 50% 100%;
  }

  @keyframes fw-bounce {
    0%, 50%, 100% { transform: translateY(0); }
    25%, 75%      { transform: translateY(-1.3px); }
  }
  @keyframes fw-leg-swing {
    0%, 100% { transform: rotate(16deg); }
    50%      { transform: rotate(-16deg); }
  }
  @keyframes fw-arm-swing {
    0%, 100% { transform: rotate(-9deg); }
    50%      { transform: rotate(9deg); }
  }
  @keyframes fw-hat-sway {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .fw-character, .fw-leg, .fw-arm, .fw-hat {
      animation: none !important;
    }
  }
</style>

<g class="fw-character">

  <!-- 奥側の脚 -->
  <g class="fw-leg fw-leg-back">
    <rect x="13" y="21" width="2.6" height="5.6" rx="1.3" fill="#1C2B3D"/>
    <ellipse cx="14.3" cy="27.3" rx="2.1" ry="1.3" fill="#8A5A2B" stroke="#1C2B3D" stroke-width="1.3"/>
  </g>

  <!-- 胴体（法被風） -->
  <path d="M11.2 21.5 C11 18 12.6 14.6 17 14.6 C21.2 14.6 22.6 18 22.2 21.8
           C22 23.6 20.2 24.6 17 24.6 C13.6 24.6 11.4 23.5 11.2 21.5 Z"
        fill="#1C2B3D" stroke="#1C2B3D" stroke-width="2" stroke-linejoin="round"/>

  <!-- 手前側の脚 -->
  <g class="fw-leg fw-leg-front">
    <rect x="17.6" y="21" width="2.6" height="5.6" rx="1.3" fill="#1C2B3D"/>
    <ellipse cx="18.9" cy="27.3" rx="2.1" ry="1.3" fill="#8A5A2B" stroke="#1C2B3D" stroke-width="1.3"/>
  </g>

  <!-- 頭 -->
  <circle cx="16.6" cy="11.3" r="5.2" fill="#F1C9A5" stroke="#1C2B3D" stroke-width="2"/>

  <!-- 顔 -->
  <circle cx="18.9" cy="11.3" r="0.85" fill="#1C2B3D"/>
  <path d="M17.6 13.4 Q19 14.6 20.3 13.3" fill="none" stroke="#1C2B3D"
        stroke-width="1" stroke-linecap="round"/>

  <!-- 麦わら帽子 -->
  <g class="fw-hat">
    <ellipse cx="15.6" cy="7.6" rx="8.4" ry="1.9" fill="#E0B84A" stroke="#1C2B3D" stroke-width="2"/>
    <ellipse cx="14.6" cy="5"   rx="5"   ry="2.9" fill="#E0B84A" stroke="#1C2B3D" stroke-width="2"/>
    <rect x="10.4" y="6.9" width="7.2" height="1.5" rx="0.75" fill="#A83B2E"/>
  </g>

  <!-- じょうろを持つ腕 -->
  <g class="fw-arm">
    <path d="M21.6 16.4 L24.6 19.6" fill="none" stroke="#1C2B3D"
          stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="24.7" cy="19.7" r="1.2" fill="#F1C9A5"/>
    <rect x="24.6" y="18.2" width="4" height="3.2" rx="1" fill="#6E8B9E"
          stroke="#1C2B3D" stroke-width="1.3"/>
    <path d="M28.4 18.6 L30.6 20.2 L28.6 20.4 Z" fill="#6E8B9E"
          stroke="#1C2B3D" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M25.2 18.2 Q26.6 16.6 27.9 18" fill="none" stroke="#6E8B9E"
          stroke-width="1.1" stroke-linecap="round"/>
  </g>

</g>
</svg>
